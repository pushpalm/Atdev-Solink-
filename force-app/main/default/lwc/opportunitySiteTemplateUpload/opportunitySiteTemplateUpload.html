<template>
    <template if:true={hasError}>
        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
            <template if:true={errorMessage}>
                <p>{errorMessage}</p>
            </template>
            <template if:true={hasValidationErrors}>
                <p><strong>The following required fields are missing. Please update your CSV and re-upload:</strong></p>
                <template for:each={validationErrors} for:item="rowError">
                    <div key={rowError.rowLabel} class="slds-m-top_x-small">
                        <p><strong>{rowError.rowLabel}</strong></p>
                        <ul class="slds-list_dotted">
                            <template for:each={rowError.missingFields} for:item="field">
                                <li key={field}>{field}</li>
                            </template>
                        </ul>
                    </div>
                </template>
            </template>
        </div>
    </template>

    <lightning-input
        type="file"
        label="Upload completed template"
        accept=".csv,text/csv"
        onchange={handleFileChange}
    ></lightning-input>

    <template if:true={fileName}>
        <p class="slds-m-top_small">Selected file: {fileName}</p>
    </template>

    <template if:true={rowCount}>
        <p class="slds-m-top_small">Rows ready to update: {rowCount}</p>
    </template>

    <div class="custom-footer">
        <lightning-button label="Previous" onclick={handlePrevious}></lightning-button>
        <lightning-button
            variant="brand"
            label="Next"
            disabled={cannotProceed}
            onclick={handleNext}
        ></lightning-button>
    </div>
</template>
